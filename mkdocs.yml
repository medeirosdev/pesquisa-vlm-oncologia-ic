site_name: OncoVLM
site_url: https://medeirosdev.github.io/pesquisa-vlm-oncologia-ic/
site_description: "VLMs na Oncologia: Democratizando o Pré-Diagnóstico e a Interpretação de Exames Histopatológicos"
site_author: "[a preencher]"

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - toc.integrate
    - search.suggest
    - content.code.copy

# a página visao_geral/ é um HTML estático; o README dela é só pra quem lê o repositório
exclude_docs: |
  visao_geral/README.md

nav:
  - Início: index.md
  - Datasets: datasets.md
  - Modelos Locais: modelos-locais.md
  - Metodologia: metodologia.md
  - Conceitos: conceitos.md
  - Pipelines: pipelines.md
  - Questões: questoes.md
  - Visão geral da pipeline: visao_geral/

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
